        <text x="32" y="481"><tspan fill="#7EE787">andsujr@github</tspan><tspan fill="#8B949E">:</tspan><tspan fill="#79C0FF">~</tspan><tspan fill="#8B949E">$ </tspan><tspan fill="#E6EDF3">cat links.txt</tspan></text>
        <text x="32" y="513" fill="#79C0FF">github.com/andsujr</text>

